      <stop offset="0" stop-color="#25f4ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#25f4ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="85%" cy="75%" r="55%">
