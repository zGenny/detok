      <stop offset=".55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#fff6c9"/>
