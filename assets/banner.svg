    <rect x="-92" y="-92" width="184" height="184" rx="44" fill="#fe2c55" transform="translate(7 7)"/>
    <rect x="-92" y="-92" width="184" height="184" rx="44" fill="#000"/>
    <use href="#flamePath" fill="url(#flame)" transform="translate(0 4)"/>
    <use href="#corePath" fill="url(#core)" transform="translate(0 4)"/>
