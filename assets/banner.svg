    <path id="flamePath" d="M0 -78 C 30 -44 58 -18 52 22 C 47 58 24 78 0 78 C -24 78 -50 60 -53 26 C -56 -6 -36 -24 -22 -52 C -16 -28 -8 -20 2 -18 C 10 -38 8 -58 0 -78 Z"/>
